[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pylake-backend"
version = "0.1.0"
description = "PyLake API and data processing backend"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14",
  "argon2-cffi>=23.1",
  "boto3>=1.35",
  "duckdb>=1.1",
  "email-validator>=2.2",
  "fastapi>=0.115",
  "httpx>=0.28",
  "openpyxl>=3.1",
  "passlib[bcrypt]>=1.7",
  "polars>=1.20",
  "psycopg[binary]>=3.2",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "pyarrow>=18",
  "python-multipart>=0.0.20",
  "sqlalchemy>=2.0",
  "sqlglot>=26",
  "croniter>=6",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
