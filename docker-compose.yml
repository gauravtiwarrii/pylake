services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pylake
      POSTGRES_USER: pylake
      POSTGRES_PASSWORD: pylake
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pylake -d pylake"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    profiles: ["minio"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pylake
      MINIO_ROOT_PASSWORD: pylake-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://pylake:pylake@postgres:5432/pylake
      SQLITE_DATABASE_URL: sqlite:///./pylake.db
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: pylake
      MINIO_SECRET_KEY: pylake-local-secret
      MINIO_BUCKET: pylake
      CORS_ORIGINS: http://localhost:3000
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-45}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-1}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-4096}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.7}
      AI_TOP_P: ${AI_TOP_P:-0.95}
      AI_ENABLE_THINKING: ${AI_ENABLE_THINKING:-true}
      AI_REASONING_BUDGET: ${AI_REASONING_BUDGET:-2048}
      AI_MAX_CONTEXT_CHARS: ${AI_MAX_CONTEXT_CHARS:-12000}
      AI_MAX_INPUT_CHARS: ${AI_MAX_INPUT_CHARS:-30000}
      AI_MAX_HISTORY_MESSAGES: ${AI_MAX_HISTORY_MESSAGES:-12}
      AI_RATE_LIMIT_REQUESTS: ${AI_RATE_LIMIT_REQUESTS:-30}
      AI_RATE_LIMIT_WINDOW_SECONDS: ${AI_RATE_LIMIT_WINDOW_SECONDS:-3600}
      AI_DAILY_TOKEN_LIMIT: ${AI_DAILY_TOKEN_LIMIT:-100000}
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    command: ["sh", "-c", "python -m alembic upgrade head && python -m app.worker"]
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://pylake:pylake@postgres:5432/pylake
      SQLITE_DATABASE_URL: sqlite:///./pylake.db
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: pylake
      MINIO_SECRET_KEY: pylake-local-secret
      MINIO_BUCKET: pylake
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
